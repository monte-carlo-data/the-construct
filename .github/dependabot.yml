version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dev-only Python dependencies (pytest, PyYAML) declared in requirements-dev.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
